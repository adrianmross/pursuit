<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pursuit API reference</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      .pursuit-xref { display: flex; gap: 1rem; align-items: center; padding: 0.5rem 1rem; background: #141615; color: #f1f1ee; font-size: 0.8rem; }
      .pursuit-xref a { color: inherit; text-decoration: none; opacity: 0.8; }
      .pursuit-xref a:hover { opacity: 1; text-decoration: underline; }
      .pursuit-xref strong { font-weight: 600; opacity: 1; }
    </style>
  </head>
  <body>
    <nav class="pursuit-xref">
      <strong>pursuit</strong>
      <a href="/">Dashboard</a>
      <a href="/docs/">Docs</a>
    </nav>
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <script>
      // The dashboard keeps its API token in localStorage, so a page load can't
      // carry it as a header; the gate is therefore client-side. Anyone without
      // a working session is sent to sign in and back. The same token is handed
      // to Scalar so "Try it" calls this origin as the signed-in user.
      (async function () {
        var token = "";
        try { token = localStorage.getItem("pursuit.token") || ""; } catch (e) {}
        var headers = token ? { Authorization: "Bearer " + token } : {};
        var ok = false;
        try { ok = (await fetch("/v1/me", { headers: headers })).ok; } catch (e) {}
        if (!ok) { location.replace("/login?next=" + encodeURIComponent("/reference")); return; }
        Scalar.createApiReference("#app", {
          url: "/openapi.json",
          theme: "none",
          showDeveloperTools: "never",
          servers: [{ url: location.origin }],
          authentication: {
            preferredSecurityScheme: "bearerAuth",
            securitySchemes: { bearerAuth: { token: token } },
          },
        });
      })();
    </script>
  </body>
</html>
