<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pursuit API reference</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      /* The dashboard's palette (web-app/app/globals.css) on Scalar's variables. */
      .light-mode {
        --scalar-background-1: #FFFFFF; --scalar-background-2: #F6F6F4; --scalar-background-3: #ECECE8;
        --scalar-color-1: #141615; --scalar-color-2: #5D615E; --scalar-color-3: #8A8E8A;
        --scalar-color-accent: #173A2E; --scalar-background-accent: #173A2E1a;
        --scalar-border-color: #DCDCD6;
      }
      .dark-mode {
        --scalar-background-1: #0E0F0F; --scalar-background-2: #161817; --scalar-background-3: #1F2120;
        --scalar-color-1: #F1F1EE; --scalar-color-2: #A3A7A4; --scalar-color-3: #6B706C;
        --scalar-color-accent: #E8C547; --scalar-background-accent: #E8C5471f;
        --scalar-border-color: #2E312F;
      }
      .light-mode, .dark-mode {
        --scalar-font: "Inter Variable", system-ui, -apple-system, "Segoe UI", sans-serif;
        --scalar-font-code: "JetBrains Mono Variable", ui-monospace, Menlo, monospace;
        --scalar-radius: 6px; --scalar-radius-lg: 10px; --scalar-radius-xl: 16px;
      }
      .pursuit-xref { display: flex; gap: 1rem; align-items: center; padding: 0.5rem 1rem; background: #141615; color: #f1f1ee; font-size: 0.8rem; }
      .pursuit-xref a { color: inherit; text-decoration: none; opacity: 0.8; }
      .pursuit-xref a:hover { opacity: 1; text-decoration: underline; }
      .pursuit-xref strong { font-weight: 600; opacity: 1; }
      /* Same footer as the dashboard (web-app/components/SiteFooter.tsx), in this page's dark chrome. */
      .pursuit-footer { display: flex; flex-direction: column; align-items: center; gap: 1rem; padding: 2rem 1.25rem; background: #141615; color: #a3a7a4; font-size: 0.875rem; }
      .pursuit-footer a { color: inherit; text-decoration: none; }
      .pursuit-footer a:hover { color: #f1f1ee; }
      .pursuit-footer-brand { display: flex; align-items: center; gap: 0.5rem; color: #f1f1ee; }
      .pursuit-footer-nav { display: flex; gap: 1.25rem; }
      .pursuit-footer-credit { order: 1; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0.25rem 0.375rem; margin: 0; font-size: 0.75rem; text-align: center; }
      .pursuit-footer-credit > span:first-child { display: inline-flex; align-items: center; gap: 0.375rem; }
      .pursuit-footer-credit > a { flex-basis: 100%; }
      .pursuit-footer-dot { display: none; }
      .pursuit-heart { width: 14px; height: 14px; fill: currentColor; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: fill .15s, stroke .15s; }
      .pursuit-heart:hover { fill: #ef4444; stroke: #ef4444; }
      @media (prefers-reduced-motion: no-preference) { .pursuit-heart:hover { animation: pursuit-heartbeat 1.4s ease-in-out infinite; } }
      @keyframes pursuit-heartbeat { 0%, 40%, 100% { transform: scale(1); } 10%, 30% { transform: scale(1.25); } 20% { transform: scale(1.05); } }
      @media (min-width: 640px) {
        .pursuit-footer-credit > a { flex-basis: auto; }
        .pursuit-footer-dot { display: inline; }
      }
      @media (min-width: 768px) {
        .pursuit-footer { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1.5rem; padding: 2rem max(1.25rem, calc((100% - 72rem) / 2)); }
        .pursuit-footer-brand { justify-self: start; }
        .pursuit-footer-credit { order: 0; }
        .pursuit-footer-nav { justify-self: end; }
      }
    </style>
  </head>
  <body>
    <nav class="pursuit-xref">
      <a href="/" aria-label="Hire Pursuit"><img src="/brand/hire-pursuit-wordmark-reverse.svg" alt="Hire Pursuit" height="18" style="display:block" /></a>
      <a href="/">Dashboard</a>
      <a href="/docs/">Docs</a>
    </nav>
    <div id="app"></div>
    <footer class="pursuit-footer">
      <a href="/" class="pursuit-footer-brand"><img src="/brand/hire-pursuit-mark-reverse.svg" alt="" height="20" /> Hire Pursuit</a>
      <p class="pursuit-footer-credit">
        <span>
          Built with
          <svg aria-label="love" role="img" viewBox="0 0 24 24" class="pursuit-heart"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5" /></svg>
          by Adrian Ross
        </span>
        <span aria-hidden="true" class="pursuit-footer-dot">·</span>
        <a href="https://github.com/adrianmross/pursuit/blob/main/LICENSE">MIT License © 2026</a>
      </p>
      <nav class="pursuit-footer-nav">
        <a href="/docs/">Docs</a>
        <a href="/reference">Reference</a>
        <a href="https://github.com/adrianmross/pursuit">GitHub</a>
      </nav>
    </footer>
    <!-- Pinned with SRI: the bare package URL follows @latest, so a Scalar release could change this page without a deploy. -->
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.76.4/dist/browser/standalone.js" integrity="sha384-hwB9WroDTpZaI38gr+u9CXA6ksz5gUYgD2GxXazKl/agT1L2GWUiRFWGJYNiFu4Q" crossorigin="anonymous"></script>
    <script>
      // The page is public, like /openapi.json it renders. "Try it" calls this
      // origin: a signed-in dashboard's pursuit_session cookie rides along on
      // those same-origin requests, and a token an older build left in
      // localStorage is handed to Scalar as the bearer token.
      (function () {
        if (typeof Scalar === "undefined") {
          document.getElementById("app").textContent = "The API reference viewer didn't load. The raw spec is at /openapi.json.";
          return;
        }
        var token = "";
        try { token = localStorage.getItem("pursuit.token") || ""; } catch (e) {}
        // Within a group: by path, then list, create, update, delete.
        var rank = { get: 0, post: 1, put: 2, patch: 2, delete: 3 };
        Scalar.createApiReference("#app", {
          url: "/openapi.json",
          theme: "none",
          showDeveloperTools: "never",
          hideModels: true,
          agent: { disabled: true },
          operationsSorter: function (a, b) {
            return a.path === b.path ? rank[a.method.toLowerCase()] - rank[b.method.toLowerCase()] : a.path < b.path ? -1 : 1;
          },
          servers: [{ url: location.origin }],
          authentication: {
            preferredSecurityScheme: "bearerAuth",
            securitySchemes: { bearerAuth: { token: token } },
          },
        });
      })();
    </script>
  </body>
</html>
