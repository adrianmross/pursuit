services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pursuit
      POSTGRES_PASSWORD: pursuit
      POSTGRES_DB: pursuit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pursuit"]
      interval: 5s
      timeout: 3s
      retries: 10
  pursuit-a:
    build: .
    environment:
      PURSUIT_DATABASE_URL: postgres://pursuit:pursuit@postgres:5432/pursuit?sslmode=disable
      PURSUIT_ADDR: ":8787"
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/pursuit", "ready", "--server", "http://127.0.0.1:8787"]
      interval: 5s
      timeout: 3s
      retries: 10
  pursuit-b:
    build: .
    environment:
      PURSUIT_DATABASE_URL: postgres://pursuit:pursuit@postgres:5432/pursuit?sslmode=disable
      PURSUIT_ADDR: ":8787"
    ports:
      - "8788:8787"
    depends_on:
      postgres:
        condition: service_healthy
