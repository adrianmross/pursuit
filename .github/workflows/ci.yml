name: ci

on:
  # main only: a PR branch already runs on pull_request. release-plan.yml
  # listens for this push run on main.
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pursuit
          POSTGRES_PASSWORD: pursuit
          POSTGRES_DB: pursuit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pursuit" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web-app/package-lock.json
            docs-site/package-lock.json
      # internal/dashboard embeds web-app's static export (//go:embed dist)
      # — build it first, same script as vercel.json's buildCommand, or go
      # vet/test fail to even compile.
      - run: sh scripts/vercel-build.sh
      - run: go vet ./...
      - run: go test ./...
      # Same store and API tests on Postgres; each test gets its own schema.
      - run: go test ./internal/sqlstore/... ./internal/httpapi/
        env:
          PURSUIT_TEST_DATABASE_URL: postgres://pursuit:pursuit@127.0.0.1:5432/pursuit?sslmode=disable

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # The built extension in Chromium against a real `pursuit serve`. The spec
  # compiles ./cmd/pursuit, which embeds the dashboard, so build that first.
  extension-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web-app/package-lock.json
            docs-site/package-lock.json
            extension/package-lock.json
      - run: sh scripts/vercel-build.sh
      - working-directory: extension
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extension-e2e
          path: |
            extension/test-results/
            extension/playwright-report/
