name: ci

# Pull requests only: main is protected, so a merge is already a tested tree.
# release-plan.yml listens for the push to main itself.
on:
  pull_request:

# A newer push to a PR branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pursuit
          POSTGRES_PASSWORD: pursuit
          POSTGRES_DB: pursuit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pursuit" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web-app/package-lock.json
            docs-site/package-lock.json
      # internal/dashboard embeds web-app's static export (//go:embed dist)
      # — build it first, same script as vercel.json's buildCommand, or go
      # vet/test fail to even compile.
      - uses: ./.github/actions/web-build
      - run: go vet ./...
      - run: go test ./...
      # Same store and API tests on Postgres; each test gets its own schema.
      - run: go test ./internal/sqlstore/... ./internal/httpapi/
        env:
          PURSUIT_TEST_DATABASE_URL: postgres://pursuit:pursuit@127.0.0.1:5432/pursuit?sslmode=disable

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # The built extension in Chromium against a real `pursuit serve`. The spec
  # compiles ./cmd/pursuit, which embeds the dashboard, so build that first.
  extension-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web-app/package-lock.json
            docs-site/package-lock.json
            extension/package-lock.json
      - uses: ./.github/actions/web-build
      - working-directory: extension
        run: npm ci
      # The browser download is the slow part of the install; the system
      # libraries (--with-deps) are not cached, so that step runs every time.
      - id: playwright
        working-directory: extension
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - working-directory: extension
        run: |
          if [ "${{ steps.browsers.outputs.cache-hit }}" = true ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
          npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extension-e2e
          path: |
            extension/test-results/
            extension/playwright-report/
