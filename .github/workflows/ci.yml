name: ci

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # internal/dashboard embeds web-app's static export (//go:embed dist)
      # — build it first, same script as vercel.json's buildCommand, or go
      # vet/test fail to even compile.
      - run: sh scripts/vercel-build.sh
      - run: go vet ./...
      - run: go test ./...

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
