name: ci

on:
  push:
  pull_request:

jobs:
  # A user-visible PR carries a .changelogs fragment, and its title is the
  # release subject Release Please reads for the bump. Release Please's own PR
  # consumes the fragments, so it is exempt.
  changelog:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changelogger
        uses: adrianmross/changelogger@v0.10.0
      # Title and body go through env, never `args`: PR text is untrusted.
      - env:
          CHANGELOGGER: ${{ steps.changelogger.outputs.path }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          # Fragments merged earlier stay on main until the release PR consumes
          # them; check only the ones this PR adds, or every PR in between must
          # reuse an old title. The checkout is disposable.
          git diff --name-only --diff-filter=A "origin/${BASE_REF}...HEAD" -- .changelogs > "$RUNNER_TEMP/added"
          for f in .changelogs/*.md; do
            [ "$f" = .changelogs/README.md ] || grep -qxF "$f" "$RUNNER_TEMP/added" || rm -- "$f"
          done
          # A new migration changes the schema an older binary can read, so it
          # needs at least a minor release.
          if git cat-file -e "origin/${BASE_REF}:internal/sqlstore/testdata/migrations.txt" 2>/dev/null &&
            git diff "origin/${BASE_REF}...HEAD" -- internal/sqlstore/testdata/migrations.txt | grep '^+[0-9]' >/dev/null; then
            grep -qxE 'bump: (minor|major)' .changelogs/*.md ||
              { echo "::error::this PR adds a migration; its .changelogs fragment needs bump: minor or major"; exit 1; }
          fi
          "$CHANGELOGGER" check --base "origin/${BASE_REF}" --pr --pr-title "$PR_TITLE" --pr-body "$PR_BODY"

  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pursuit
          POSTGRES_PASSWORD: pursuit
          POSTGRES_DB: pursuit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pursuit" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # internal/dashboard embeds web-app's static export (//go:embed dist)
      # — build it first, same script as vercel.json's buildCommand, or go
      # vet/test fail to even compile.
      - run: sh scripts/vercel-build.sh
      - run: go vet ./...
      - run: go test ./...
      # Same store and API tests on Postgres; each test gets its own schema.
      - run: go test ./internal/sqlstore/... ./internal/httpapi/
        env:
          PURSUIT_TEST_DATABASE_URL: postgres://pursuit:pursuit@127.0.0.1:5432/pursuit?sslmode=disable

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build

  # Build only: the devenv OCI image is not pushed anywhere yet.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      # Pinned to the devenv this config is tested with locally.
      - run: nix profile install --accept-flake-config github:cachix/devenv/v2.3.1
      # docker-compose.yml is generated from devenv.nix; fail if it drifted.
      - run: devenv tasks run dev:compose && git diff --exit-code docker-compose.yml
      - run: devenv shell -- make linux
      - run: devenv container build serve
