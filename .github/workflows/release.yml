name: release

# Builds a tag into a GitHub release: CLI/server binaries via GoReleaser plus
# the browser extension zip. Dispatched by release-plan.yml; a hand-pushed tag
# works too.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v0.1.0)
        required: true

permissions:
  contents: write
  # Build provenance attestations (Sigstore OIDC) and the GHCR artifact.
  id-token: write
  attestations: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      TAP_APP_ID: ${{ secrets.TAP_APP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web-app/package-lock.json
            docs-site/package-lock.json
            extension/package-lock.json
      # The binary go:embeds the dashboard and docs build.
      - run: sh scripts/vercel-build.sh
      - run: go test ./...
      - working-directory: extension
        run: |
          npm ci
          npm run build
          (cd dist && zip -qr "$RUNNER_TEMP/pursuit-extension_${TAG#v}.zip" .)
      # This tag's CHANGELOG.md section becomes the release notes.
      - run: awk '/^## /{if (n++) exit} n' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          # skip=validate: the web builds above leave npm lockfile churn behind.
          args: release --clean --skip=validate --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}
      # Provenance for every archive in checksums.txt. The extension zip is a
      # GoReleaser extra_file, so it is not in checksums.txt; attest it apart.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/checksums.txt
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ runner.temp }}/pursuit-extension_*.zip
      # The production deploy. Not a push to a `release` branch: GitHub refuses
      # a GITHUB_TOKEN push whose history adds or changes a workflow file
      # (v0.2.1's tag hit exactly that), and most releases do. Vercel builds
      # the tag's source remotely, the same as a Git deploy.
      - name: Deploy to production
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@65.8.0 deploy --prod --yes --token="$VERCEL_TOKEN" \
            --meta githubDeployment=1 --meta githubCommitRef="$TAG"
      # GoReleaser's release is made with GITHUB_TOKEN, so it fires no
      # `release: published` workflow; poke the tap from here instead. Without
      # the TAP_APP_* secrets this skips and the tap's 6h poll picks it up.
      - id: tap-token
        if: env.TAP_APP_ID != ''
        uses: actions/create-github-app-token@v2.1.4
        with:
          app-id: ${{ secrets.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: adrianmross
          repositories: homebrew-tap
      - if: steps.tap-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          gh api --method POST /repos/adrianmross/homebrew-tap/dispatches \
            -f event_type=formula-bump \
            -F "client_payload[repo]=${GITHUB_REPOSITORY}" \
            -F "client_payload[tag]=${TAG}"
      # The release files as one OCI artifact (not an image) on GHCR. Last, so
      # a registry hiccup never blocks the production deploy or the tap.
      - uses: oras-project/setup-oras@v2
        with:
          version: 1.3.6
      - id: oras
        name: Push release files to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ghcr.io/adrianmross/pursuit-release
        run: |
          echo "$REGISTRY_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Push from inside dist/ so pulled files keep their bare names.
          cp "$RUNNER_TEMP/pursuit-extension_${TAG#v}.zip" dist/
          cd dist
          # The source annotation links the new GHCR package to this repo.
          digest=$(oras push --artifact-type application/vnd.pursuit.release.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --format go-template='{{.digest}}' "$REPO:${TAG#v}" ./*.tar.gz ./*.zip checksums.txt)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          case "$TAG" in *-*) ;; *) oras tag "$REPO:${TAG#v}" latest ;; esac
      # Storage records are for organization-owned repositories only.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/adrianmross/pursuit-release
          subject-digest: ${{ steps.oras.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
