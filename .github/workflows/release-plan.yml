name: release-plan

# Release Please opens the release PR (version bumps + CHANGELOG.md) from
# conventional commits; changelogger fragments are consumed on that PR.
#
# The release PR is opened with the pursuit-release App's token so its checks
# run. Tagging and dispatch stay on GITHUB_TOKEN: GitHub does not start
# workflows from refs that token creates, so this pushes the tag itself and
# dispatches release.yml directly instead of relying on a `push: tags` trigger.

on:
  # main is protected: every merge already passed ci on its PR.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write # release-please creates its autorelease labels
  pull-requests: write

concurrency: release-plan

jobs:
  release-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # The release PR and the commit that consumes fragments must come from
      # an App, not GITHUB_TOKEN: GitHub starts no workflows for refs that
      # token creates, so the PR would never get the checks main requires.
      # Without the RELEASE_APP_* secrets this falls back to GITHUB_TOKEN and
      # the PR needs an admin merge.
      - id: app-token
        if: env.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v2.1.4
        env:
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - id: release-please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - id: release-pr
        if: steps.release-please.outputs.prs_created == 'true'
        uses: adrianmross/changelogger@v0.11.0
        with:
          command: release-info
        env:
          CHANGELOGGER_RELEASE_PRS: ${{ steps.release-please.outputs.prs }}

      - if: steps.release-pr.outputs.head_ref != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release-pr.outputs.head_ref }}
          path: release-pr
          token: ${{ steps.app-token.outputs.token || github.token }}

      - if: steps.release-pr.outputs.head_ref != ''
        uses: adrianmross/changelogger@v0.11.0
        with:
          command: consume
          working-directory: release-pr

      - if: steps.release-pr.outputs.head_ref != ''
        working-directory: release-pr
        env:
          HEAD_REF: ${{ steps.release-pr.outputs.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .changelogs; then
            echo "No fragments to consume."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .changelogs
          git commit -m "chore(release): consume changelog fragments"
          git push origin "HEAD:${HEAD_REF}"

      # The manifest only moves when a release PR merges, so an untagged
      # manifest version is the release signal. Works for squash and merge
      # commits alike, and a re-run is a no-op once the tag exists.
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r '."."' .release-please-manifest.json)"
          tag="v${version}"
          if [ "$version" = "0.0.0" ] || git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "Nothing to tag (${tag})."
            exit 0
          fi
          # Tag the commit that bumped the manifest (the merged release PR), not
          # HEAD: later merges may have landed before this run.
          release_sha="$(git log -1 --format=%H -- .release-please-manifest.json)"
          # Created through the API, not `git push`: GitHub refuses a pushed ref
          # whose history adds a workflow file unless the token has the
          # `workflows` permission, which GITHUB_TOKEN can never get (v0.2.1).
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${tag}" -f sha="$release_sha" >/dev/null
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"

      # Release Please refuses to open the next PR while a merged one still
      # carries `autorelease: pending`. It clears that itself only when it
      # creates the GitHub release, which skip-github-release turns off.
      # Ungated, so a re-run after a half-finished release still heals it.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for n in $(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --label 'autorelease: pending' --json number --jq '.[].number'); do
            gh pr edit "$n" --repo "$GITHUB_REPOSITORY" --remove-label 'autorelease: pending'
          done
