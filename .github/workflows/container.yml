name: container

# Its own workflow, not a ci job: release-plan.yml waits on ci, and the image
# build is the slowest job. Runs only when the dev environment or build inputs
# change.

on:
  push:
    branches: [main]
    paths:
      - devenv.nix
      - devenv.yaml
      - devenv.lock
      - Dockerfile
      - docker-compose.yml
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/container.yml
  pull_request:
    paths:
      - devenv.nix
      - devenv.yaml
      - devenv.lock
      - Dockerfile
      - docker-compose.yml
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/container.yml

jobs:
  # Build only: the devenv OCI image is not pushed anywhere yet.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      # Pinned to the devenv this config is tested with locally.
      - run: nix profile install --accept-flake-config github:cachix/devenv/v2.3.1
      # docker-compose.yml is generated from devenv.nix; fail if it drifted.
      - run: devenv tasks run dev:compose && git diff --exit-code docker-compose.yml
      # The Dockerfile's Go/Node and go.mod's toolchain are pinned to devenv's.
      - run: devenv tasks run dev:pins && git diff --exit-code Dockerfile go.mod
      - run: devenv shell -- make linux
      - run: devenv container build serve
